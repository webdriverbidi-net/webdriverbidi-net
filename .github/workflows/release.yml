# Release workflow for WebDriverBiDi.NET.
#
# Triggered only by pushing a vX.Y.Z tag. Runs the full test suite (via
# _tests.yml), validates and publishes the DocFx documentation site, and
# packs and pushes NuGet packages. The release and deployment steps are
# gated via `needs:` on the reusable tests workflow — a test failure on
# the tagged commit prevents both the docs publish and the NuGet push.
#
# Documentation publishing lives here (rather than in ci.yml) so that the
# published docs always correspond to a released NuGet version. Merges to
# main between releases do not change what's visible at the docs URL.
#
# Related:
#   - ci.yml runs on PR and main push; does not run on tag push.
#   - _tests.yml is the reusable build + test workflow shared between the
#     two callers.

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/_tests.yml

  validate-docs:
    name: Validate documentation
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate documentation code regions
        run: ./docs/tools/validate-doc-regions.sh

  verify-tag:
    name: Verify tag
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Everything a tag publishes -- the NuGet packages and the documentation site -- is gated on
      # this, so a tag pushed on a commit that never reached main changes nothing users can see.
      # It is a job rather than a step of the release job because the Pages deployment does not go
      # through that job and would otherwise overwrite the published site for a tag main never had.
      - name: Verify tag is on origin/main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  build-docs:
    name: Build documentation
    needs: [tests, validate-docs, verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build WebDriverBiDi library
        run: |
          dotnet build src/WebDriverBiDi/WebDriverBiDi.csproj --configuration Release --no-restore
          dotnet build src/WebDriverBiDi.Logging/WebDriverBiDi.Logging.csproj --configuration Release --no-restore

      - name: Build documentation sample code
        run: dotnet build docs/code/WebDriverBiDi.DocSnippets.csproj --configuration Release --no-restore

      # Pinned in .config/dotnet-tools.json, which Dependabot bumps, rather than installed unpinned:
      # build-docs gates the release, so a bad DocFX release would otherwise block publishing.
      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build documentation site
        run: |
          cd docs
          dotnet docfx metadata docfx.json
          dotnet docfx build docfx.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy-docs:
    name: Deploy documentation
    # Also needs the release: published docs must correspond to a released NuGet version, so a failed
    # push leaves the docs unpublished rather than describing a version that is not on NuGet.
    needs: [build-docs, release]
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Publish to NuGet
    # Gate the package push on the documentation pipeline as well as the tests. build-docs
    # transitively requires [tests, validate-docs], so a docs failure (region validation or the
    # DocFX build itself) blocks the NuGet push, keeping the published package and docs in lockstep
    # as the workflow header promises. deploy-docs (GitHub Pages) is intentionally not a gate: it is
    # infrastructure that can be re-run without republishing the package. verify-tag is named here
    # as well as reached through build-docs, so the ancestry gate does not depend on the docs
    # pipeline keeping it.
    needs: [tests, build-docs, verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A job-level permissions block replaces the workflow-level map entirely, so
    # contents: read must be restated here: this job checks out the repository to
    # build and pack it. id-token: write enables the OIDC trusted-publishing login
    # to NuGet.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Set version variables from tag
        run: |
          GIT_TAG="${GITHUB_REF/refs\/tags\/v/}"
          VERSION="${GIT_TAG%%-*}"
          QUALIFIER="${GIT_TAG#${VERSION}}"
          QUALIFIER="${QUALIFIER#-}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
          echo "ASSEMBLY_VERSION=${MAJOR}.0.0" >> "$GITHUB_ENV"
          echo "FILE_VERSION=${MAJOR}.${MINOR}.${PATCH}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          if [ -n "${QUALIFIER}" ]; then
            echo "PACKAGE_VERSION=${VERSION}-${QUALIFIER}" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        # InformationalVersion carries the release version into the assemblies'
        # product-version metadata; without it, shipped DLLs report the MSBuild
        # default of 1.0.0 (plus the source revision) regardless of the released
        # version. SourceLink still appends the +<sha> suffix to the value set here.
        run: dotnet build --configuration Release -p:AssemblyVersion="${ASSEMBLY_VERSION}" -p:FileVersion="${FILE_VERSION}" -p:InformationalVersion="${PACKAGE_VERSION}" -p:ContinuousIntegrationBuild=true --no-restore

      - name: Pack releasable packages
        # `dotnet pack` on the solution packs only projects with
        # IsPackable=true, which is WebDriverBiDi, WebDriverBiDi.Analyzers,
        # and WebDriverBiDi.Logging. Symbol-package emission is configured
        # per-project in the csproj files (only library and logging produce
        # .snupkg; the analyzer has no managed assembly to symbolicate).
        #
        # The version properties are repeated here even though the build step above already
        # passed them and this pack runs --no-build. MSBuild global properties do not carry
        # across invocations, and the analyzer package's shipped assemblies are not produced
        # by that build step at all: the analyzer's pack target compiles the roslyn4.8 and
        # roslyn5.9 variants in a child `dotnet build` during pack, forwarding whichever of
        # these properties the pack invocation was given (see
        # BuildAnalyzerRoslynVariantsBeforePack in WebDriverBiDi.Analyzers.csproj). Without
        # them here that child build falls back to the SDK default, so the shipped analyzer
        # assemblies report 1.0.0.0 while the package around them carries the release version.
        # The other two packages are unaffected either way, since --no-build leaves the
        # assemblies the build step already stamped.
        run: >
          dotnet pack WebDriverBiDi.NET.sln --configuration Release
          -p:PackageVersion="${PACKAGE_VERSION}"
          -p:AssemblyVersion="${ASSEMBLY_VERSION}"
          -p:FileVersion="${FILE_VERSION}"
          -p:InformationalVersion="${PACKAGE_VERSION}"
          -p:ContinuousIntegrationBuild=true
          --no-build --output .

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "*.nupkg" --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key "${NUGET_API_KEY}"
