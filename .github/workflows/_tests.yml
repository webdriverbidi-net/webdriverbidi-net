# Reusable workflow: build the solution and run all tests (unit, analyzer,
# logging, integration), and, unless include-dramaturge is false, Dramaturge's. Called by ci.yml (on PR and main push) and by
# release.yml (on tag push). Not triggered directly.
#
# The leading underscore in the filename is a convention to signal "not a
# user-facing workflow" — GitHub itself does not treat it specially.
#
# The caller names this workflow under its own `jobs.<id>:` which becomes the
# check prefix shown on PRs (e.g. "tests / unit-tests").

name: Tests (reusable)

on:
  workflow_call:
    inputs:
      include-dramaturge:
        # The Dramaturge steps run on pull requests and main pushes, so a core change that breaks Dramaturge fails
        # before it merges; release.yml turns them off, so they never block a WebDriverBiDi release.
        description: Whether to build and test Dramaturge as well.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore Dramaturge dependencies
        if: inputs.include-dramaturge
        run: dotnet restore dramaturge/Dramaturge.sln

      - name: Build
        # -warnaserror enforces the project's "PRs should contain no warnings" convention
        # (README.md) in CI rather than leaving it to reviewer diligence. The solution builds
        # warning-free today, so this gate only fails on a newly introduced warning.
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Build Dramaturge
        if: inputs.include-dramaturge
        run: dotnet build dramaturge/Dramaturge.sln --configuration Release --no-restore -warnaserror

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore Dramaturge dependencies
        if: inputs.include-dramaturge
        run: dotnet restore dramaturge/Dramaturge.sln

      - name: Build
        # -warnaserror enforces the project's "PRs should contain no warnings" convention
        # (README.md) in CI rather than leaving it to reviewer diligence. The solution builds
        # warning-free today, so this gate only fails on a newly introduced warning.
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Build Dramaturge
        if: inputs.include-dramaturge
        run: dotnet build dramaturge/Dramaturge.sln --configuration Release --no-restore -warnaserror

      # Note that each coverage report is scoped only to the assemblies being tested
      - name: Test WebDriverBiDi library (with coverage)
        run: >
          dotnet test --project test/WebDriverBiDi.Tests --configuration Release --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[WebDriverBiDi]*"
          --results-directory test/coverage --coverlet-file-prefix lcov-library

      - name: Enforce library coverage thresholds
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage/lcov-library.*.info

      - name: Test Roslyn analyzers (with coverage)
        # Include both the analyzers and code fix providers coverage in one report
        run: >
          dotnet test --project test/WebDriverBiDi.Analyzers.Tests --configuration Release --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[WebDriverBiDi.Analyzers]*"
          --coverlet-include "[WebDriverBiDi.Analyzers.CodeFixProviders]*"
          --results-directory test/coverage --coverlet-file-prefix lcov-analyzers

      - name: Enforce analyzer coverage thresholds
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage/lcov-analyzers.*.info

      - name: Test structured logging library (with coverage)
        run: >
          dotnet test --project test/WebDriverBiDi.Logging.Tests --configuration Release --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[WebDriverBiDi.Logging]*"
          --results-directory test/coverage --coverlet-file-prefix lcov-logging

      - name: Enforce logging coverage thresholds
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage/lcov-logging.*.info

      - name: Test Dramaturge browser management library (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.Browsers.Tests --configuration Release --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.Browsers]*"
          --results-directory test/coverage --coverlet-file-prefix lcov-dramaturge-browsers

      - name: Enforce Dramaturge browser management coverage thresholds
        if: inputs.include-dramaturge
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage/lcov-dramaturge-browsers.*.info

      - name: Test extensions library (with coverage)
        run: >
          dotnet test --project test/WebDriverBiDi.Extensions.Tests --configuration Release --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[WebDriverBiDi.Extensions]*"
          --results-directory test/coverage --coverlet-file-prefix lcov-extensions

      - name: Enforce extensions coverage thresholds
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage/lcov-extensions.*.info

      - name: Test Dramaturge command-line tool (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.Tool.Tests --configuration Release --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.Tool]*"
          --results-directory test/coverage --coverlet-file-prefix lcov-dramaturge-tool

      - name: Enforce Dramaturge command-line tool coverage thresholds
        if: inputs.include-dramaturge
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage/lcov-dramaturge-tool.*.info

      - name: Test Dramaturge automation library (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.Tests --configuration Release --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge]*"
          --results-directory test/coverage --coverlet-file-prefix lcov-dramaturge

      - name: Enforce Dramaturge automation coverage thresholds
        if: inputs.include-dramaturge
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage/lcov-dramaturge.*.info

      - name: Test Dramaturge xUnit package (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.Xunit.Tests --configuration Release --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.Xunit]*"
          --results-directory test/coverage --coverlet-file-prefix lcov-dramaturge-xunit

      - name: Test Dramaturge NUnit package (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.NUnit.Tests --configuration Release --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.NUnit]*"
          --results-directory test/coverage --coverlet-file-prefix lcov-dramaturge-nunit

      - name: Test Dramaturge MSTest package (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.MSTest.Tests --configuration Release --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.MSTest]*"
          --results-directory test/coverage --coverlet-file-prefix lcov-dramaturge-mstest

      - name: Test Dramaturge TUnit package (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.TUnit.Tests --configuration Release --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.TUnit]*"
          --results-directory test/coverage --coverlet-file-prefix lcov-dramaturge-tunit

      # These tests reach what each package's own cannot: no shared browser registered. A report names its sources, not
      # its assembly, and the packages share sources, so each package's coverage is collected, and merged, on its own.
      - name: Test Dramaturge test framework packages without their shared browser registered (with coverage)
        if: inputs.include-dramaturge
        run: |
          for package in Xunit NUnit MSTest TUnit; do
            prefix="lcov-dramaturge-$(echo "$package" | tr '[:upper:]' '[:lower:]')"
            dotnet test --project dramaturge/test/Dramaturge.TestFrameworks.Unregistered.Tests --configuration Release --no-build --verbosity normal \
              --coverlet --coverlet-output-format lcov --coverlet-include "[Dramaturge.$package]*" \
              --results-directory test/coverage --coverlet-file-prefix "$prefix-unregistered"
            ./dramaturge/scripts/merge-lcov.sh "test/coverage/$prefix-merged.info" test/coverage/"$prefix".*.info test/coverage/"$prefix"-unregistered.*.info
          done

      - name: Enforce Dramaturge test framework package coverage thresholds
        if: inputs.include-dramaturge
        run: |
          for package in xunit nunit mstest tunit; do
            ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 "test/coverage/lcov-dramaturge-$package-merged.info"
          done

      - name: Enforce combined coverage thresholds
        # Perform an aggregate threshold check
        run: >
          ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95
          test/coverage/lcov-library.*.info
          test/coverage/lcov-analyzers.*.info
          test/coverage/lcov-logging.*.info
          test/coverage/lcov-extensions.*.info

      - name: Enforce combined Dramaturge coverage thresholds
        if: inputs.include-dramaturge
        run: >
          ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95
          test/coverage/lcov-dramaturge-browsers.*.info
          test/coverage/lcov-dramaturge-tool.*.info
          test/coverage/lcov-dramaturge.*.info
          test/coverage/lcov-dramaturge-xunit-merged.info
          test/coverage/lcov-dramaturge-nunit-merged.info
          test/coverage/lcov-dramaturge-mstest-merged.info
          test/coverage/lcov-dramaturge-tunit-merged.info

      # The analyzer package's shipped layout is produced entirely by a pack target that nothing else
      # runs: the Roslyn 5.9 variant is compiled only inside it, every other CI build and test uses the
      # 4.8 default, and the staging paths it packs from are literal strings that must be kept in step
      # with the variant list by hand. Packing here means a mistake in that target fails a PR rather
      # than the release.
      - name: Pack the analyzer package
        # The version properties mirror the ones release.yml passes to its own pack step. Supplying
        # them to the pack invocation is the only way the shipped analyzer assemblies get stamped:
        # the pack target forwards them to the child build that compiles the Roslyn variants, and
        # nothing else in the repository exercises that path. Packing with them here lets the step
        # below prove the forwarding still works. The values are deliberately unlike any real release
        # version so that the check cannot pass by coincidence.
        run: >
          dotnet pack src/WebDriverBiDi.Analyzers/WebDriverBiDi.Analyzers.csproj --configuration Release
          -o test/package -p:GeneratePackageOnBuild=true
          -p:AssemblyVersion=9.9.9.9 -p:FileVersion=9.9.9.9 -p:InformationalVersion=9.9.9-packprobe

      - name: Verify the analyzer package layout
        run: |
          set -euo pipefail
          package=$(ls test/package/WebDriverBiDi.Analyzers.*.nupkg)
          echo "Inspecting $package"
          rm -rf test/package/extracted
          unzip -q "$package" -d test/package/extracted

          status=0
          for variant in roslyn4.8 roslyn5.9; do
            directory="test/package/extracted/analyzers/dotnet/$variant/cs"
            # A roslyn<major.minor> folder must hold a build compiled against that Roslyn version.
            expected_roslyn="${variant#roslyn}.0.0"
            for assembly in WebDriverBiDi.Analyzers.dll WebDriverBiDi.Analyzers.CodeFixProviders.dll; do
              if [ ! -f "$directory/$assembly" ]; then
                echo "FAIL $variant/cs/$assembly is missing"
                status=1
                continue
              fi

              # These assemblies are compiled by a child `dotnet build` inside the pack target, which
              # stamps them only with the version properties the pack invocation forwards to it. If
              # that forwarding breaks, they ship as 1.0.0.0 inside a package carrying the release
              # version, and nothing else would notice. The probe value comes from the pack step above
              # and is matched against the assembly's embedded metadata strings.
              if ! grep -a -q '9.9.9-packprobe' "$directory/$assembly"; then
                echo "FAIL $variant/cs/$assembly is not version stamped; the pack target did not forward the version properties"
                status=1
              else
                echo "OK   $variant/cs/$assembly (version stamped)"
              fi

              # The same child build selects the Roslyn version from the RoslynVersion property the pack
              # target passes per variant. If that stopped arriving, every folder would hold the default
              # 4.8 build, and a compiler picking the newest folder would get none of the newer build's
              # API use, with every check above still passing.
              if ! roslyn_reference=$(dotnet run scripts/print-assembly-reference-version.cs -- "$directory/$assembly" Microsoft.CodeAnalysis); then
                echo "FAIL $variant/cs/$assembly does not reference Microsoft.CodeAnalysis"
                status=1
              elif [ "$roslyn_reference" != "$expected_roslyn" ]; then
                echo "FAIL $variant/cs/$assembly references Microsoft.CodeAnalysis $roslyn_reference, not $expected_roslyn"
                status=1
              else
                echo "OK   $variant/cs/$assembly (references Microsoft.CodeAnalysis $roslyn_reference)"
              fi
            done
          done

          # The compiler host supplies the Roslyn assemblies. Shipping our own copy makes the analyzer
          # load against a different version than the compiler is running, which fails in ways that are
          # hard to diagnose from a consumer's build log.
          if compiler_assemblies=$(find test/package/extracted -name 'Microsoft.CodeAnalysis*.dll' -print -quit); [ -n "$compiler_assemblies" ]; then
            echo "FAIL the package ships Roslyn assemblies, which must be left to the compiler host:"
            find test/package/extracted -name 'Microsoft.CodeAnalysis*.dll'
            status=1
          else
            echo "OK   no Roslyn assemblies are shipped"
          fi

          exit "$status"

      # Dramaturge is released from its own repository; packing it here, without pushing, proves its packages pack.
      - name: Pack Dramaturge
        if: inputs.include-dramaturge
        run: |
          dotnet pack dramaturge/Dramaturge.sln --configuration Release --no-build --output test/dramaturge-packages
          for id in Dramaturge Dramaturge.Browsers Dramaturge.Tool Dramaturge.Xunit Dramaturge.NUnit Dramaturge.MSTest Dramaturge.TUnit; do
            ls test/dramaturge-packages/"$id".[0-9]*.nupkg >/dev/null || { echo "FAIL no package for $id was produced."; exit 1; }
          done

      # release.yml pushes only the packages scripts/check-release-packages.sh allows. Running the same check on a
      # pack of the solution here means a change that would break it, such as a Dramaturge project added to the
      # solution, fails a pull request rather than the release.
      - name: Pack the solution and check its packages
        run: |
          dotnet pack WebDriverBiDi.NET.sln --configuration Release --no-build --output test/release-packages
          ./scripts/check-release-packages.sh test/release-packages

      - name: Upload code coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          # A coveralls.io outage must not fail the job that gates pull requests and the tag release.
          fail-on-error: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: test/coverage/lcov-library.*.info test/coverage/lcov-analyzers.*.info test/coverage/lcov-logging.*.info test/coverage/lcov-dramaturge-browsers.*.info test/coverage/lcov-extensions.*.info test/coverage/lcov-dramaturge-tool.*.info test/coverage/lcov-dramaturge.*.info test/coverage/lcov-dramaturge-xunit-merged.info test/coverage/lcov-dramaturge-nunit-merged.info test/coverage/lcov-dramaturge-mstest-merged.info test/coverage/lcov-dramaturge-tunit-merged.info
          format: lcov

  # Deliberately a job of its own rather than a `configuration` matrix on unit-tests; see the
  # continuous integration section in README.md before collapsing the two.
  unit-tests-debug:
    name: Unit tests (Debug coverage)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore Dramaturge dependencies
        if: inputs.include-dramaturge
        run: dotnet restore dramaturge/Dramaturge.sln

      - name: Build
        run: dotnet build --configuration Debug --no-restore -warnaserror

      - name: Build Dramaturge
        if: inputs.include-dramaturge
        run: dotnet build dramaturge/Dramaturge.sln --configuration Debug --no-restore -warnaserror

      - name: Test WebDriverBiDi library (with coverage)
        run: >
          dotnet test --project test/WebDriverBiDi.Tests --configuration Debug --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[WebDriverBiDi]*"
          --results-directory test/coverage-debug --coverlet-file-prefix lcov-library

      - name: Enforce library coverage thresholds
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage-debug/lcov-library.*.info

      - name: Test Roslyn analyzers (with coverage)
        run: >
          dotnet test --project test/WebDriverBiDi.Analyzers.Tests --configuration Debug --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[WebDriverBiDi.Analyzers]*"
          --coverlet-include "[WebDriverBiDi.Analyzers.CodeFixProviders]*"
          --results-directory test/coverage-debug --coverlet-file-prefix lcov-analyzers

      - name: Enforce analyzer coverage thresholds
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage-debug/lcov-analyzers.*.info

      - name: Test structured logging library (with coverage)
        run: >
          dotnet test --project test/WebDriverBiDi.Logging.Tests --configuration Debug --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[WebDriverBiDi.Logging]*"
          --results-directory test/coverage-debug --coverlet-file-prefix lcov-logging

      - name: Enforce logging coverage thresholds
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage-debug/lcov-logging.*.info

      - name: Test Dramaturge browser management library (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.Browsers.Tests --configuration Debug --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.Browsers]*"
          --results-directory test/coverage-debug --coverlet-file-prefix lcov-dramaturge-browsers

      - name: Enforce Dramaturge browser management coverage thresholds
        if: inputs.include-dramaturge
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage-debug/lcov-dramaturge-browsers.*.info

      - name: Test extensions library (with coverage)
        run: >
          dotnet test --project test/WebDriverBiDi.Extensions.Tests --configuration Debug --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[WebDriverBiDi.Extensions]*"
          --results-directory test/coverage-debug --coverlet-file-prefix lcov-extensions

      - name: Enforce extensions coverage thresholds
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage-debug/lcov-extensions.*.info

      - name: Test Dramaturge command-line tool (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.Tool.Tests --configuration Debug --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.Tool]*"
          --results-directory test/coverage-debug --coverlet-file-prefix lcov-dramaturge-tool

      - name: Enforce Dramaturge command-line tool coverage thresholds
        if: inputs.include-dramaturge
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage-debug/lcov-dramaturge-tool.*.info

      - name: Test Dramaturge automation library (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.Tests --configuration Debug --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge]*"
          --results-directory test/coverage-debug --coverlet-file-prefix lcov-dramaturge

      - name: Enforce Dramaturge automation coverage thresholds
        if: inputs.include-dramaturge
        run: ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 test/coverage-debug/lcov-dramaturge.*.info

      - name: Test Dramaturge xUnit package (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.Xunit.Tests --configuration Debug --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.Xunit]*"
          --results-directory test/coverage-debug --coverlet-file-prefix lcov-dramaturge-xunit

      - name: Test Dramaturge NUnit package (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.NUnit.Tests --configuration Debug --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.NUnit]*"
          --results-directory test/coverage-debug --coverlet-file-prefix lcov-dramaturge-nunit

      - name: Test Dramaturge MSTest package (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.MSTest.Tests --configuration Debug --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.MSTest]*"
          --results-directory test/coverage-debug --coverlet-file-prefix lcov-dramaturge-mstest

      - name: Test Dramaturge TUnit package (with coverage)
        if: inputs.include-dramaturge
        run: >
          dotnet test --project dramaturge/test/Dramaturge.TUnit.Tests --configuration Debug --no-build --verbosity normal
          --coverlet --coverlet-output-format lcov
          --coverlet-include "[Dramaturge.TUnit]*"
          --results-directory test/coverage-debug --coverlet-file-prefix lcov-dramaturge-tunit

      # These tests reach what each package's own cannot: no shared browser registered. A report names its sources, not
      # its assembly, and the packages share sources, so each package's coverage is collected, and merged, on its own.
      - name: Test Dramaturge test framework packages without their shared browser registered (with coverage)
        if: inputs.include-dramaturge
        run: |
          for package in Xunit NUnit MSTest TUnit; do
            prefix="lcov-dramaturge-$(echo "$package" | tr '[:upper:]' '[:lower:]')"
            dotnet test --project dramaturge/test/Dramaturge.TestFrameworks.Unregistered.Tests --configuration Debug --no-build --verbosity normal \
              --coverlet --coverlet-output-format lcov --coverlet-include "[Dramaturge.$package]*" \
              --results-directory test/coverage-debug --coverlet-file-prefix "$prefix-unregistered"
            ./dramaturge/scripts/merge-lcov.sh "test/coverage-debug/$prefix-merged.info" test/coverage-debug/"$prefix".*.info test/coverage-debug/"$prefix"-unregistered.*.info
          done

      - name: Enforce Dramaturge test framework package coverage thresholds
        if: inputs.include-dramaturge
        run: |
          for package in xunit nunit mstest tunit; do
            ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95 "test/coverage-debug/lcov-dramaturge-$package-merged.info"
          done

      - name: Enforce combined coverage thresholds
        run: >
          ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95
          test/coverage-debug/lcov-library.*.info
          test/coverage-debug/lcov-analyzers.*.info
          test/coverage-debug/lcov-logging.*.info
          test/coverage-debug/lcov-extensions.*.info

      - name: Enforce combined Dramaturge coverage thresholds
        if: inputs.include-dramaturge
        run: >
          ./scripts/check-lcov-thresholds.sh --min-line 95 --min-branch 95 --min-method 95
          test/coverage-debug/lcov-dramaturge-browsers.*.info
          test/coverage-debug/lcov-dramaturge-tool.*.info
          test/coverage-debug/lcov-dramaturge.*.info
          test/coverage-debug/lcov-dramaturge-xunit-merged.info
          test/coverage-debug/lcov-dramaturge-nunit-merged.info
          test/coverage-debug/lcov-dramaturge-mstest-merged.info
          test/coverage-debug/lcov-dramaturge-tunit-merged.info

  unit-tests-windows:
    name: Unit tests (Windows)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore Dramaturge dependencies
        if: inputs.include-dramaturge
        run: dotnet restore dramaturge/Dramaturge.sln

      - name: Build
        # -warnaserror enforces the project's "PRs should contain no warnings" convention
        # (README.md) in CI rather than leaving it to reviewer diligence. The solution builds
        # warning-free today, so this gate only fails on a newly introduced warning.
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Build Dramaturge
        if: inputs.include-dramaturge
        run: dotnet build dramaturge/Dramaturge.sln --configuration Release --no-restore -warnaserror

      # Running tests on Windows will deliberately not produce code coverage metrics
      - name: Test WebDriverBiDi library
        run: dotnet test --project test/WebDriverBiDi.Tests --configuration Release --no-build --verbosity normal

      - name: Test Roslyn analyzers
        run: dotnet test --project test/WebDriverBiDi.Analyzers.Tests --configuration Release --no-build --verbosity normal

      - name: Test structured logging library
        run: dotnet test --project test/WebDriverBiDi.Logging.Tests --configuration Release --no-build --verbosity normal

      - name: Test Dramaturge browser management library
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.Browsers.Tests --configuration Release --no-build --verbosity normal

      - name: Test extensions library
        run: dotnet test --project test/WebDriverBiDi.Extensions.Tests --configuration Release --no-build --verbosity normal

      - name: Test Dramaturge command-line tool
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.Tool.Tests --configuration Release --no-build --verbosity normal

      - name: Test Dramaturge automation library
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.Tests --configuration Release --no-build --verbosity normal

      - name: Test Dramaturge xUnit package
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.Xunit.Tests --configuration Release --no-build --verbosity normal

      - name: Test Dramaturge NUnit package
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.NUnit.Tests --configuration Release --no-build --verbosity normal

      - name: Test Dramaturge MSTest package
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.MSTest.Tests --configuration Release --no-build --verbosity normal

      - name: Test Dramaturge TUnit package
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.TUnit.Tests --configuration Release --no-build --verbosity normal

      - name: Test Dramaturge test framework packages without their shared browser registered
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.TestFrameworks.Unregistered.Tests --configuration Release --no-build --verbosity normal

      # Runs the netstandard2.0 builds on the real .NET Framework, which only Windows has.
      - name: Test on .NET Framework
        run: dotnet test --project test/WebDriverBiDi.NetFramework.Tests --configuration Release --no-build --verbosity normal

      - name: Test Dramaturge browser management library on .NET Framework
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.Browsers.NetFramework.Tests --configuration Release --no-build --verbosity normal

  # Compatibility tests build and run a separate consumer application against a specific build of
  # the library (currently the netstandard2.0 one) over a scripted WebSocket server. They need no
  # browser, so they run once per operating system here rather than once per browser per operating
  # system inside the integration matrices.
  compatibility-tests:
    name: Compatibility tests (${{ matrix.os.display }})
    needs: build
    runs-on: ${{ matrix.os.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - image: ubuntu-latest
            display: Linux
          - image: windows-latest
            display: Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore Dramaturge dependencies
        if: inputs.include-dramaturge
        run: dotnet restore dramaturge/Dramaturge.sln

      - name: Build
        # -warnaserror enforces the project's "PRs should contain no warnings" convention
        # (README.md) in CI rather than leaving it to reviewer diligence. The solution builds
        # warning-free today, so this gate only fails on a newly introduced warning.
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Build Dramaturge
        if: inputs.include-dramaturge
        run: dotnet build dramaturge/Dramaturge.sln --configuration Release --no-restore -warnaserror

      - name: Run compatibility tests
        run: dotnet test --project test/WebDriverBiDi.Compatibility.Tests --configuration Release --no-build --verbosity normal
        env:
          CI: true

      - name: Run Dramaturge compatibility tests
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.Browsers.Compatibility.Tests --configuration Release --no-build --verbosity normal
        env:
          CI: true

  integration-tests:
    name: Integration tests (${{ matrix.browser.display }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser:
          - name: firefox-nightly
            display: Firefox Nightly
            browser-type: firefox
          - name: chrome-canary
            display: Chrome Canary
            browser-type: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore Dramaturge dependencies
        if: inputs.include-dramaturge
        run: dotnet restore dramaturge/Dramaturge.sln

      - name: Build
        # -warnaserror enforces the project's "PRs should contain no warnings" convention
        # (README.md) in CI rather than leaving it to reviewer diligence. The solution builds
        # warning-free today, so this gate only fails on a newly introduced warning.
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Build Dramaturge
        if: inputs.include-dramaturge
        run: dotnet build dramaturge/Dramaturge.sln --configuration Release --no-restore -warnaserror

      - name: Create local browser directory
        run: mkdir -p "$GITHUB_WORKSPACE/browsers"

      - name: Install Firefox Nightly
        if: matrix.browser.name == 'firefox-nightly'
        run: |
          curl -s -L -o firefox-nightly.tar.xz "https://download.mozilla.org/?product=firefox-nightly-latest-ssl&os=linux64&lang=en-US"
          tar xJf firefox-nightly.tar.xz -C "$GITHUB_WORKSPACE/browsers"

      - name: Install Chrome Canary
        if: matrix.browser.name == 'chrome-canary'
        run: |
          curl -s -L "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json" \
            | jq '.channels["Canary"]["downloads"]["chrome"].[] | select(.platform == "linux64") | .url' \
            | xargs curl -s -L -o chrome-canary.zip
          unzip chrome-canary.zip -d "$GITHUB_WORKSPACE/browsers"
          mv "$GITHUB_WORKSPACE/browsers/chrome-linux64" "$GITHUB_WORKSPACE/browsers/chrome-canary"

      - name: Run integration tests
        run: dotnet test --project test/WebDriverBiDi.Integration.Tests --configuration Release --no-build --verbosity normal
        env:
          CI: true
          FIREFOX_EXECUTABLE: ${{ matrix.browser.browser-type == 'firefox' && format('{0}/browsers/firefox/firefox', github.workspace) || '' }}
          CHROME_EXECUTABLE: ${{ matrix.browser.browser-type == 'chrome' && format('{0}/browsers/chrome-canary/chrome', github.workspace) || '' }}

      - name: Run Dramaturge integration tests
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.IntegrationTests --configuration Release --no-build --verbosity normal
        env:
          CI: true
          FIREFOX_EXECUTABLE: ${{ matrix.browser.browser-type == 'firefox' && format('{0}/browsers/firefox/firefox', github.workspace) || '' }}
          CHROME_EXECUTABLE: ${{ matrix.browser.browser-type == 'chrome' && format('{0}/browsers/chrome-canary/chrome', github.workspace) || '' }}

      - name: Run Dramaturge examples
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/samples/Dramaturge.Examples --configuration Release --no-build --verbosity normal
        env:
          CI: true
          DRAMATURGE_BROWSER: ${{ matrix.browser.browser-type }}
          FIREFOX_EXECUTABLE: ${{ matrix.browser.browser-type == 'firefox' && format('{0}/browsers/firefox/firefox', github.workspace) || '' }}
          CHROME_EXECUTABLE: ${{ matrix.browser.browser-type == 'chrome' && format('{0}/browsers/chrome-canary/chrome', github.workspace) || '' }}

  integration-tests-windows:
    name: Integration tests (${{ matrix.browser.display }}, Windows)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    # windows-latest defaults to Windows PowerShell 5.1, whose Invoke-WebRequest
    # buffers whole responses through a slow pipeline; PowerShell 7 downloads the
    # browser archives in a fraction of the time.
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        browser:
          - name: firefox-nightly
            display: Firefox Nightly
            browser-type: firefox
          - name: chrome-canary
            display: Chrome Canary
            browser-type: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore Dramaturge dependencies
        if: inputs.include-dramaturge
        run: dotnet restore dramaturge/Dramaturge.sln

      - name: Build
        # -warnaserror enforces the project's "PRs should contain no warnings" convention
        # (README.md) in CI rather than leaving it to reviewer diligence. The solution builds
        # warning-free today, so this gate only fails on a newly introduced warning.
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Build Dramaturge
        if: inputs.include-dramaturge
        run: dotnet build dramaturge/Dramaturge.sln --configuration Release --no-restore -warnaserror

      - name: Create local browser directory
        run: New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\browsers" | Out-Null

      # The Windows Nightly build ships as an NSIS self-extracting installer rather
      # than an archive. Its /ExtractDir switch unpacks the payload without running
      # a real installation, placing the browser files in a "core" subdirectory —
      # the same mechanism SelfExtractingExecutableFileExtractor uses. Renaming
      # "core" to "firefox" keeps the on-disk layout identical to the Linux job's.
      - name: Install Firefox Nightly
        if: matrix.browser.name == 'firefox-nightly'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $installer = Join-Path $env:RUNNER_TEMP 'firefox-nightly-installer.exe'
          $extractDir = Join-Path $env:RUNNER_TEMP 'firefox-nightly-extract'
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Invoke-WebRequest -Uri 'https://download.mozilla.org/?product=firefox-nightly-latest-ssl&os=win64&lang=en-US' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/ExtractDir=$extractDir" -Wait
          Move-Item -Path (Join-Path $extractDir 'core') -Destination "$env:GITHUB_WORKSPACE\browsers\firefox"

      # Expand-Archive is used nowhere here because it is pathologically slow on an
      # archive of Chrome's size; ZipFile.ExtractToDirectory does the same job in a
      # fraction of the time.
      - name: Install Chrome Canary
        if: matrix.browser.name == 'chrome-canary'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $versions = Invoke-RestMethod -Uri 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json'
          $url = ($versions.channels.Canary.downloads.chrome | Where-Object { $_.platform -eq 'win64' }).url
          $archive = Join-Path $env:RUNNER_TEMP 'chrome-canary.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, "$env:GITHUB_WORKSPACE\browsers")
          Move-Item -Path "$env:GITHUB_WORKSPACE\browsers\chrome-win64" -Destination "$env:GITHUB_WORKSPACE\browsers\chrome-canary"

      - name: Run integration tests
        run: dotnet test --project test/WebDriverBiDi.Integration.Tests --configuration Release --no-build --verbosity normal
        env:
          CI: true
          FIREFOX_EXECUTABLE: ${{ matrix.browser.browser-type == 'firefox' && format('{0}\browsers\firefox\firefox.exe', github.workspace) || '' }}
          CHROME_EXECUTABLE: ${{ matrix.browser.browser-type == 'chrome' && format('{0}\browsers\chrome-canary\chrome.exe', github.workspace) || '' }}

      - name: Run Dramaturge integration tests
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/test/Dramaturge.IntegrationTests --configuration Release --no-build --verbosity normal
        env:
          CI: true
          FIREFOX_EXECUTABLE: ${{ matrix.browser.browser-type == 'firefox' && format('{0}\browsers\firefox\firefox.exe', github.workspace) || '' }}
          CHROME_EXECUTABLE: ${{ matrix.browser.browser-type == 'chrome' && format('{0}\browsers\chrome-canary\chrome.exe', github.workspace) || '' }}

      - name: Run Dramaturge examples
        if: inputs.include-dramaturge
        run: dotnet test --project dramaturge/samples/Dramaturge.Examples --configuration Release --no-build --verbosity normal
        env:
          CI: true
          DRAMATURGE_BROWSER: ${{ matrix.browser.browser-type }}
          FIREFOX_EXECUTABLE: ${{ matrix.browser.browser-type == 'firefox' && format('{0}\browsers\firefox\firefox.exe', github.workspace) || '' }}
          CHROME_EXECUTABLE: ${{ matrix.browser.browser-type == 'chrome' && format('{0}\browsers\chrome-canary\chrome.exe', github.workspace) || '' }}
