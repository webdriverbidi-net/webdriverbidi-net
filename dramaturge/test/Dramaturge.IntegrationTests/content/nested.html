<!DOCTYPE html>
<html>
  <head>
    <title>Nested elements</title>
  </head>
  <body>
    <div class="section" id="outer">
      <div class="section" id="inner">
        <span class="leaf">A</span>
      </div>
      <span class="leaf">B</span>
    </div>
    <div class="section" id="other">
      <span class="leaf">C</span>
    </div>
    <ul id="list">
      <li>One</li>
      <li>Two</li>
      <li style="display: none">Three</li>
    </ul>
  </body>
</html>
