<!DOCTYPE html>
<html>
  <head>
    <title>Elements</title>
  </head>
  <body>
    <p id="shown">Shown</p>
    <p id="hidden" style="display: none">Hidden</p>
    <ul>
      <li>One</li>
      <li>Two</li>
      <li>Three</li>
    </ul>
    <button id="reveal" onclick="setTimeout(() => { document.getElementById('hidden').style.display = 'block'; }, 300)">Reveal</button>
    <script>
      setTimeout(() => {
        const late = document.createElement('p');
        late.id = 'late';
        late.textContent = 'Late';
        document.body.appendChild(late);
      }, 500);
    </script>
  </body>
</html>
